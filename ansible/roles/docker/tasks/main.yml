---
- name: Install Docker
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Enable Docker service
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add Jenkins user to Docker group
  user:
    name: jenkins
    groups: docker
    append: true
